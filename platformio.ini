[env:esp32s3_save_to_sd]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
; Use qio_opi for Octal PSRAM boards (ESP32-S3-EYE V2.2 / Freenove ESP32-S3 WROOM N8R8 / N16R8).
; Switch to qio_qspi if using a Quad PSRAM module.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 8MB
build_flags =
    -DBOARD_HAS_PSRAM
    -Iinclude
